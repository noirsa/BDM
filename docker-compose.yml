x-airflow-common:
  &airflow-common
  build: ./docker/airflow
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__POOLS__INGESTION_LOCK: '{"slots":1,"description":"Mutex for ingestion and move tasks"}'
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW_CONN_AWS_DEFAULT: "aws://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@/?endpoint_url=http%3A%2F%2Fminio%3A9000&addressing_style=path"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    # but feel free to experiment with the "built-in" examples by setting this to 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    # Kafka
    KAFKA_BOOTSTRAP_SERVERS: 'kafka:9092'
    SPARK_MASTER_URL: 'spark://spark-master:7077'
    SPARK_MASTER_UI_URL: 'http://spark-master:8080/json/'
    CONSUMPTION_DASHBOARD_NOTEBOOK_PATH: '/opt/airflow/notebooks/Consumption Zone/2. spark_streaming_with_kafka_dash.ipynb'
    CONSUMPTION_DASHBOARD_SCRIPT_PATH: '/opt/airflow/scripts/consumption_streaming_dashboard.py'
    CONSUMPTION_DASHBOARD_CHECKPOINT_LOCATION: '/opt/airflow/logs/checkpoints/consumption_streaming_dashboard/weather'
    CONSUMPTION_DASHBOARD_LOG_PATH: '/opt/airflow/logs/consumption_streaming_dashboard.log'
    DASHBOARD_SPARK_APP_NAME: 'consumption_streaming_dashboard'
    DASHBOARD_POSTGRES_JDBC_URL: 'jdbc:postgresql://postgres-analytics:5432/analytics'
    DASHBOARD_POSTGRES_TABLE: 'weather_events'
    DASHBOARD_POSTGRES_USER: 'superset'
    DASHBOARD_POSTGRES_PASSWORD: 'superset'
    CLIP_MODEL_PATH: 'openai/clip-vit-base-patch32'
    HF_HOME: '/opt/airflow/hf_cache'
    IMAGE_EMBEDDING_DEVICE: 'auto'
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # The following line can be used to set a custom config file, stored in the local config folder
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/notebooks:/opt/airflow/notebooks:ro
    - ${AIRFLOW_PROJ_DIR:-.}/scripts:/opt/airflow/scripts:ro
    - airflow-logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/huggingface:/opt/airflow/hf_cache
    - ./.env:/opt/.env
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_DOMAIN: ${MINIO_HOST}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-rbac:
    image: minio/mc:latest
    container_name: minio-rbac
    env_file:
      - ${ENV_FILE_PATH:-.env}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./init-scripts/minio-rbac.sh:/init-scripts/minio-rbac.sh:ro
      - ./config/minio_policies:/config/minio_policies:ro
    entrypoint: ["/bin/sh", "/init-scripts/minio-rbac.sh"]
    restart: on-failure


  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./init-scripts/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # Single PLAINTEXT listener on :9092, advertised as kafka:9092.
      # Other containers connect via kafka:9092; `docker compose exec` commands
      # use localhost:9092 (same port, resolved inside the container).
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # "Laptop-friendly resource limits"
      # Cap the JVM heap so Kafka does not claim too much there
      KAFKA_HEAP_OPTS: '-Xmx384m -Xms256m'
      # Retain messages for 2 h and at most 100 MB — sufficient for a lab session.
      KAFKA_LOG_RETENTION_HOURS: '2'
      KAFKA_LOG_RETENTION_BYTES: '104857600'
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8081:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      # "Laptop-friendly resource limits"
      # Cap the JVM heap; the UI is read-only and needs very little memory.
      JAVA_OPTS: '-Xmx192m -Xms128m'
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./config/kafkaui_config.yml:/etc/kafkaui/dynamic_config.yaml
    restart: unless-stopped

  kafka-producer:
    build: ./docker/producer
    env_file:
    - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 'kafka:9092'
      KAFKA_TOPIC: 'server-metrics-raw'
      BATCH_SIZE: '20'
      INTERVAL_SECONDS: '5'
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      # yamllint disable rule:line-length
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,config}

    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # or by explicitly targeted on the command line e.g. docker-compose up flower.
  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # You can enable airflow-cli by adding "--profile debug" option e.g. docker-compose --profile debug up
  # or by explicitly targeted on the command line e.g. docker-compose up airflow-cli.
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  spark-master:
    build:
      context: ./docker/spark
      dockerfile: pyspark.Dockerfile      
    entrypoint: /opt/spark/sbin/start-master.sh
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_OPTS: "-Dspark.deploy.defaultCores=4"
    ports:
      - "7077:7077"   # Spark master
      - "8082:8080"   # Spark master Web UI
    volumes:
      - ./huggingface:/opt/spark/hf_cache

  spark-worker:
    build:
      context: ./docker/spark
      dockerfile: pyspark.Dockerfile
    entrypoint: /opt/spark/sbin/start-worker.sh
    command: ["spark://spark-master:7077"]
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ./spark_data:/data
      - ./huggingface:/opt/spark/hf_cache
    depends_on:
      - spark-master

  jupyter:
    build: ./docker/jupyter/
    env_file:
      - ${ENV_FILE_PATH:-.env}
    ports:
      - "8888:8888"
      - "4040:4040"   # Spark application Web UI
    volumes:
      - .:/home/jovyan/work
      - ./spark_data:/data
      - ./huggingface:/opt/spark/hf_cache
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: jupyter
      CLIP_MODEL_PATH: openai/clip-vit-base-patch32
      HF_HOME: /opt/spark/hf_cache
      IMAGE_EMBEDDING_DEVICE: auto
    depends_on:
      - spark-master

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    volumes:
      - ./mongo_data:/data/db
      - ./init-scripts/mongo-rbac.js:/docker-entrypoint-initdb.d/20-mongo-rbac.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://mongo:mongo@localhost:27017/admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  mongo-rbac:
    image: mongo:7
    container_name: mongo-rbac
    env_file:
      - ${ENV_FILE_PATH:-.env}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./init-scripts/mongo-rbac.js:/docker-entrypoint-initdb.d/20-mongo-rbac.js:ro
    entrypoint:
      - mongosh
      - mongodb://mongo:mongo@mongo:27017/admin
      - /docker-entrypoint-initdb.d/20-mongo-rbac.js
    restart: on-failure

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8083:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongo
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongo
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

 # ── Key-value store ───────────────────────────────────────────────────────────
  # Milvus uses etcd for cluster coordination and metadata management
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd

    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"

    command: >
      etcd
      --advertise-client-urls=http://milvus-etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd

    volumes:
      - etcd_data:/etcd

    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── Milvus standalone ─────────────────────────────────────────────────────────
  # Vector database for embeddings and semantic search (movies collection)
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: "milvus-etcd:2379"
      MINIO_ADDRESS: "minio:9000"
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      common.security.authorizationEnabled: "true"
      COMMON_SECURITY_AUTHORIZATION_ENABLED: "true"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"
      - "9091:9091"

  milvus-rbac:
    build: ./docker/airflow
    container_name: milvus-rbac
    env_file:
      - ${ENV_FILE_PATH:-.env}
    environment:
      MILVUS_URI: http://milvus:19530
      MILVUS_ROOT_USER: ${MILVUS_ROOT_USER:-root}
      MILVUS_ROOT_PASSWORD: ${MILVUS_ROOT_PASSWORD:-Milvus}
      MILVUS_WRITER_USER: ${MILVUS_WRITER_USER:-bdm_vector_writer}
      MILVUS_WRITER_PASSWORD: ${MILVUS_WRITER_PASSWORD:-bdm_vector_writer_password}
      MILVUS_READER_USER: ${MILVUS_READER_USER:-bdm_vector_reader}
      MILVUS_READER_PASSWORD: ${MILVUS_READER_PASSWORD:-bdm_vector_reader_password}
      MILVUS_IMAGE_COLLECTION: ${MILVUS_IMAGE_COLLECTION:-image_vector_catalog}
    depends_on:
      milvus:
        condition: service_healthy
    volumes:
      - ./init-scripts/milvus-rbac.py:/opt/airflow/init-scripts/milvus-rbac.py:ro
    entrypoint: ["python", "/opt/airflow/init-scripts/milvus-rbac.py"]
    restart: on-failure

  # ── Attu vector search UI ─────────────────────────────────────────────────────
  # Having an UI is always nice. Not necessary, just nice :)
  attu:
    image: zilliz/attu:v3.0.0-beta.1
    ports:
      - "3000:3000"
    environment:
      - MILVUS_ADDRESS=milvus:19530
      - MILVUS_USERNAME=${MILVUS_READER_USER:-bdm_vector_reader}
      - MILVUS_PASSWORD=${MILVUS_READER_PASSWORD:-bdm_vector_reader_password}
    volumes:
      - attu_data:/data
    depends_on:
      milvus:
        condition: service_healthy
      milvus-rbac:
        condition: service_completed_successfully


  postgres-analytics:
    image: postgres:16
    container_name: postgres-analytics
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: analytics
    ports:
      - "5433:5432"
    volumes:
      - postgres-analytics:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  superset:
    build: ./docker/superset/
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "your_secret_key"
      # Superset metadata DB. This is persisted by the postgres-analytics volume below.
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@postgres-analytics:5432/analytics
    depends_on:
      postgres-analytics:
        condition: service_healthy
    volumes:
      - superset_home:/app/superset_home
    command: >
      /bin/bash -c "
      superset db upgrade &&
      superset fab create-admin --username superset --firstname Superset --lastname Admin --email admin@superset.com --password superset || true &&
      superset init &&
      superset set-database-uri -d analytics_postgres -u postgresql+psycopg2://superset:superset@postgres-analytics:5432/analytics &&
      superset run -h 0.0.0.0 -p 8088
      "
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.2-alpine
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9005:9000"
    environment:
      - CLICKHOUSE_USER=analytics
      - CLICKHOUSE_PASSWORD=analytics_secret
      - CLICKHOUSE_DB=bi_analytics
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init-scripts/clickhouse-databases.sql:/docker-entrypoint-initdb.d/01-clickhouse-databases.sql:ro
      - ./init-scripts/clickhouse-trusted-users.xml:/etc/clickhouse-server/users.d/trusted-users.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

volumes:
  postgres-db-volume:
  minio_data:
  airflow-logs:
  mongo_data:
  clickhouse_data:
  milvus_data:
  attu_data:
  etcd_data:
  huggingface:
  postgres-analytics:
  superset_home:
