services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: adminminio
      MINIO_ROOT_PASSWORD: adminminio
      MINIO_DOMAIN: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio_data:/data

  jupyter:
    build: ./docker/
    ports:
      - "8888:8888"
    environment:
      # Hardcode the $JUPYTER_TOKEN
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-deltalake}
    volumes:
      - .:/home/jovyan/work

volumes:
  minio_data:


